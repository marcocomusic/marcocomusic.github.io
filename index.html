<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>MARCOCO — House, Techno &amp; Beyond</title>
<meta name="description" content="MARCOCO — Berlin-based house &amp; techno DJ.">
<meta property="og:title" content="MARCOCO — House, Techno &amp; Beyond">
<meta property="og:image" content="assets/img/p2.jpg">
<meta name="theme-color" content="#0b0907">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Anton&family=JetBrains+Mono:wght@400;700&family=Manrope:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{
  --ink:#0b0907; --ink-2:#15110e; --bone:#efe6da; --bone-dim:#a89c8e; --line:rgba(239,230,218,.14);
  --pink:#ff3d8b; --cyan:#3ff0ff;
  --display:'Anton',Impact,'Arial Narrow',sans-serif;
  --mono:'JetBrains Mono',ui-monospace,Menlo,monospace;
  --body:'Manrope',system-ui,sans-serif;
  --bass:0;
}
*{box-sizing:border-box;margin:0;padding:0}
html{background:var(--ink)}
html.lenis,html.lenis body{height:auto}
.lenis.lenis-smooth{scroll-behavior:auto!important}
body{background:var(--ink);color:var(--bone);font-family:var(--body);overflow-x:hidden;-webkit-font-smoothing:antialiased}
body.locked{overflow:hidden;height:100vh}
a{color:inherit;text-decoration:none}
button{font:inherit;color:inherit}
img,video{display:block}
::selection{background:var(--pink);color:var(--ink)}

#gl{position:fixed;inset:0;width:100vw;height:100vh;z-index:0;display:block}
.vignette{position:fixed;inset:0;z-index:0;pointer-events:none;background:radial-gradient(ellipse at center,transparent 35%,rgba(11,9,7,.88) 100%)}
.grain{position:fixed;inset:-50%;z-index:60;pointer-events:none;opacity:.08;background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='220' height='220'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='.85' numOctaves='3' stitchTiles='stitch'/></filter><rect width='100%' height='100%' filter='url(%23n)'/></svg>");animation:grain .9s steps(6) infinite}
@keyframes grain{0%{transform:translate(0,0)}20%{transform:translate(-5%,3%)}40%{transform:translate(4%,-6%)}60%{transform:translate(-3%,5%)}80%{transform:translate(6%,2%)}100%{transform:translate(0,0)}}
#flash{position:fixed;inset:0;z-index:70;background:var(--bone);mix-blend-mode:difference;opacity:0;pointer-events:none}
main{position:relative}

#cursor{position:fixed;left:0;top:0;width:36px;height:36px;margin:-18px 0 0 -18px;border:1px solid var(--bone);border-radius:50%;z-index:90;pointer-events:none;mix-blend-mode:difference;transition:width .35s,height .35s,margin .35s,background .35s}
#cursor.hot{width:84px;height:84px;margin:-42px 0 0 -42px;background:var(--bone)}
@media (hover:none){#cursor{display:none}}

#gate{position:fixed;inset:0;z-index:100;background:var(--ink);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:30px;text-align:center;padding:24px;clip-path:circle(150% at 50% 50%)}
.g-name{position:relative;font-family:var(--display);font-size:clamp(72px,19vw,300px);line-height:.85;color:transparent;-webkit-text-stroke:1px rgba(239,230,218,.55);letter-spacing:-.005em;white-space:nowrap}
.g-name span{position:absolute;inset:0;color:var(--bone);-webkit-text-stroke:0;clip-path:inset(100% 0 0 0)}
.g-meta{font:400 11px/1.7 var(--mono);letter-spacing:.22em;text-transform:uppercase;color:var(--bone-dim)}
.g-meta b{color:var(--bone);font-weight:700}
.g-btns{display:flex;gap:12px;flex-wrap:wrap;justify-content:center;opacity:0;transform:translateY(12px);pointer-events:none;transition:opacity .8s,transform .8s}
.g-btns.ready{opacity:1;transform:none;pointer-events:auto}
.btn{display:inline-flex;align-items:center;gap:10px;font:700 12px/1 var(--mono);letter-spacing:.16em;text-transform:uppercase;padding:18px 28px;border-radius:999px;border:1px solid var(--bone);cursor:pointer;background:transparent;color:var(--bone);transition:background .3s,color .3s,border-color .3s,transform .3s}
.btn:hover{transform:translateY(-2px)}
.btn.primary{background:var(--bone);color:var(--ink)}
.btn.primary:hover{background:var(--pink);border-color:var(--pink)}
.btn.ghost{border-color:var(--line);color:var(--bone-dim)}
.btn.ghost:hover{border-color:var(--bone);color:var(--bone)}

.top{position:fixed;top:16px;left:16px;right:16px;z-index:40;display:flex;justify-content:space-between;align-items:center;gap:12px;pointer-events:none}
.pill{pointer-events:auto;background:rgba(21,17,14,.55);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border:1px solid var(--line);border-radius:999px}
.logo{font-family:var(--display);font-size:20px;letter-spacing:.05em;padding:10px 20px}
nav.pill{display:flex;gap:2px;padding:5px}
nav a{font:700 11px/1 var(--mono);letter-spacing:.14em;text-transform:uppercase;padding:10px 14px;border-radius:999px;transition:background .3s,color .3s}
nav a:hover,nav a.on{background:var(--bone);color:var(--ink)}
nav a.book{background:var(--pink);color:var(--ink)}
nav a.book:hover{background:var(--cyan)}

.hud{position:fixed;right:22px;top:50%;transform:translateY(-50%);z-index:30;font:400 10px/1.4 var(--mono);letter-spacing:.18em;color:var(--bone-dim);display:flex;flex-direction:column;align-items:center;gap:12px;pointer-events:none;text-transform:uppercase}
.hud .bar{width:2px;height:26vh;background:var(--line);position:relative;overflow:hidden;border-radius:2px}
.hud .bar i{position:absolute;left:0;top:0;width:100%;height:100%;transform-origin:top;transform:scaleY(0);background:linear-gradient(var(--cyan),var(--pink))}
.hud .v{writing-mode:vertical-rl;transform:rotate(180deg)}
.hud .num{color:var(--bone);font-weight:700}
.hud .dot{width:8px;height:8px;border-radius:50%;background:var(--pink);box-shadow:0 0 14px var(--pink)}

.player{position:fixed;left:16px;bottom:16px;z-index:40;display:flex;align-items:center;gap:14px;padding:7px 20px 7px 7px}
.pp{width:42px;height:42px;border-radius:50%;background:var(--bone);color:var(--ink);border:0;cursor:pointer;display:grid;place-items:center;flex:none;transition:background .3s}
.pp:hover{background:var(--pink)}
.pp svg{width:14px;height:14px}
.eq{display:flex;gap:3px;align-items:flex-end;height:22px}
.eq i{width:3px;height:100%;border-radius:2px;background:var(--pink);transform-origin:bottom;transform:scaleY(.08)}
.eq i:nth-child(even){background:var(--cyan)}
.pmeta{font:400 10px/1.5 var(--mono);letter-spacing:.14em;text-transform:uppercase;white-space:nowrap}
.pmeta b{display:block;color:var(--bone);font-weight:700}
.pmeta span{color:var(--bone-dim)}

.sec{position:relative;padding:20vh 7vw}
.kicker{font:700 11px/1 var(--mono);letter-spacing:.26em;text-transform:uppercase;color:var(--pink);display:flex;gap:14px;align-items:center;margin-bottom:30px}
.kicker::before{content:'';width:30px;height:1px;background:currentColor}
.h2{font-family:var(--display);font-weight:400;font-size:clamp(52px,9.5vw,160px);line-height:.86;text-transform:uppercase;letter-spacing:-.005em}
.h2 .o,.o{color:transparent;-webkit-text-stroke:1.5px var(--bone)}
.glass{background:rgba(15,12,10,.58);backdrop-filter:blur(18px) saturate(120%);-webkit-backdrop-filter:blur(18px) saturate(120%);border:1px solid rgba(239,230,218,.08);border-radius:28px}
.mono{font-family:var(--mono)}

/* hero */
.hero{height:210vh}
.hero .stick{position:sticky;top:0;height:100vh;display:flex;flex-direction:column;justify-content:center;align-items:center;overflow:hidden;mix-blend-mode:difference}
.mega{display:flex;perspective:900px;font-family:var(--display);font-weight:400;font-size:clamp(88px,22vw,380px);line-height:.8;letter-spacing:-.005em;white-space:nowrap;color:var(--bone)}
.mega .ch{display:inline-block;will-change:transform}
.mega .ch i{display:inline-block;font-style:normal}
.hero .tags{position:absolute;left:7vw;right:7vw;top:50%;margin-top:calc(clamp(88px,22vw,380px)*.5);display:flex;justify-content:space-between;gap:20px;font:700 11px/1.6 var(--mono);letter-spacing:.24em;text-transform:uppercase;color:var(--bone);padding-top:22px}
.hero .side{position:absolute;top:110px;font:400 11px/1.6 var(--mono);letter-spacing:.2em;text-transform:uppercase;color:var(--bone-dim);max-width:250px}
.hero .side.l{left:7vw}
.hero .side.r{right:7vw;text-align:right}
.hint{position:absolute;bottom:96px;left:50%;transform:translateX(-50%);display:flex;flex-direction:column;align-items:center;gap:12px;font:400 10px/1.6 var(--mono);letter-spacing:.24em;text-transform:uppercase;color:var(--bone-dim);text-align:center}
.hint .line{width:1px;height:48px;background:linear-gradient(var(--bone),transparent);animation:drip 1.94s cubic-bezier(.6,0,.2,1) infinite;transform-origin:top}
@keyframes drip{0%{transform:scaleY(0)}50%{transform:scaleY(1)}100%{transform:scaleY(1);opacity:0}}

/* manifesto */
.manifesto{height:330vh}
.manifesto .stick{position:sticky;top:0;height:100vh;display:grid;place-items:center;overflow:hidden}
.kwrap{position:absolute;inset:0;clip-path:circle(0% at 50% 50%)}
.kwrap canvas{width:100%;height:100%;display:block}
.kwrap::after{content:'';position:absolute;inset:0;background:radial-gradient(circle at center,rgba(11,9,7,.15),rgba(11,9,7,.7))}
.lines{position:relative;text-align:center;font-family:var(--display);font-size:clamp(44px,8.6vw,146px);line-height:.92;text-transform:uppercase;mix-blend-mode:difference;color:var(--bone);padding:0 5vw}
.lines .w{display:inline-block;opacity:.08;margin:0 .12em}

/* belt */
.belt{position:relative;height:38vh;overflow:hidden}
.tape{position:absolute;left:-10%;width:120%;top:50%;white-space:nowrap;font-family:var(--display);font-size:clamp(28px,4.6vw,66px);line-height:1;text-transform:uppercase;padding:16px 0;overflow:hidden}
.tape .inner{display:inline-block;will-change:transform}
.tape.a{background:var(--pink);color:var(--ink);transform:translateY(-50%) rotate(-4deg)}
.tape.b{color:var(--cyan);border-block:1px solid var(--cyan);background:rgba(11,9,7,.75);transform:translateY(-50%) rotate(3deg)}

/* bio */
#bio .inner{display:grid;grid-template-columns:minmax(0,5fr) minmax(0,7fr);gap:6vw;align-items:center}
.portrait{position:relative;aspect-ratio:2/3;border-radius:26px;overflow:hidden;clip-path:inset(100% 0 0 0)}
.portrait img{position:absolute;left:0;top:-12%;width:100%;height:124%;object-fit:cover}
.portrait .badge{position:absolute;left:18px;bottom:18px;font:700 10px/1 var(--mono);letter-spacing:.2em;text-transform:uppercase;background:var(--bone);color:var(--ink);padding:9px 12px;border-radius:99px}
.bio-copy{padding:44px}
.bio-copy .h2{font-size:clamp(44px,5.6vw,98px)}
.bio-copy p{font-size:clamp(16px,1.25vw,19px);line-height:1.7;color:#d8cdbf;margin-top:18px}
.bio-copy p.lead{font-size:clamp(20px,1.9vw,28px);line-height:1.4;color:var(--bone);font-weight:500;margin-top:26px}
.timeline{display:flex;flex-wrap:wrap;gap:10px;margin-top:34px}
.chip{font:700 11px/1 var(--mono);letter-spacing:.12em;text-transform:uppercase;border:1px solid var(--line);border-radius:99px;padding:11px 15px}
.chip b{color:var(--pink);margin-right:8px}
.stats{display:grid;gap:16px;margin-top:40px;border-top:1px solid var(--line);padding-top:28px}
.stat .n{font-family:var(--display);font-size:clamp(44px,5.4vw,84px);line-height:.9}
.stat .n sup{font-size:.4em;color:var(--cyan);vertical-align:top;margin-left:4px}
.stat .l{font:400 10px/1.5 var(--mono);letter-spacing:.18em;text-transform:uppercase;color:var(--bone-dim);margin-top:8px}

/* gallery (horizontal) */
#gallery{height:100vh;overflow:hidden;position:relative}
#gallery .pin{height:100%;display:flex;align-items:center}
.gtrack{display:flex;align-items:center;gap:3vw;padding:0 7vw;height:100%;will-change:transform}
.gintro{flex:0 0 auto;width:min(430px,78vw)}
.gintro p{font-size:17px;line-height:1.7;color:#d8cdbf;margin-top:24px;max-width:380px}
.ghint{margin-top:30px;font:700 11px/1 var(--mono);letter-spacing:.24em;text-transform:uppercase;color:var(--pink)}
.gitem{flex:0 0 auto;position:relative;height:64vh;aspect-ratio:3/4;border-radius:20px;overflow:hidden;cursor:zoom-in;background:#000;will-change:transform}
.gitem.g1{height:46vh;aspect-ratio:4/3;align-self:flex-start;margin-top:15vh}
.gitem.g2{height:54vh;align-self:flex-end;margin-bottom:16vh}
.gitem img{position:absolute;top:0;left:-10%;width:120%;height:100%;object-fit:cover;will-change:transform}
.gitem .gn{position:absolute;top:16px;left:16px;font:700 10px/1 var(--mono);letter-spacing:.2em;background:rgba(0,0,0,.45);padding:8px 10px;border-radius:99px;backdrop-filter:blur(6px);z-index:2}
.gitem figcaption{position:absolute;left:18px;right:18px;bottom:16px;font:700 11px/1.4 var(--mono);letter-spacing:.18em;text-transform:uppercase;color:var(--bone);text-shadow:0 2px 14px rgba(0,0,0,.7);z-index:2}
.gend{flex:0 0 auto;width:min(380px,70vw);font-family:var(--display);font-size:clamp(44px,5.5vw,90px);line-height:.9;text-transform:uppercase}
.gprog{position:absolute;left:7vw;right:7vw;bottom:110px;height:2px;background:var(--line);border-radius:2px;overflow:hidden}
.gprog i{display:block;height:100%;transform-origin:left;transform:scaleX(0);background:linear-gradient(90deg,var(--cyan),var(--pink))}
#lb{position:fixed;inset:0;z-index:95;background:rgba(11,9,7,.94);display:none;align-items:center;justify-content:center;flex-direction:column;gap:18px;padding:5vh 5vw;cursor:zoom-out}
#lb.on{display:flex}
#lb img{max-width:100%;max-height:82vh;border-radius:14px;object-fit:contain}
#lb p{font:700 11px/1 var(--mono);letter-spacing:.2em;text-transform:uppercase;color:var(--bone-dim)}

/* releases */
.records{display:flex;flex-direction:column;gap:14vh;margin-top:12vh}
.rec{--art:min(440px,62vw);display:grid;grid-template-columns:var(--art) 1fr;align-items:center}
.art{position:relative;width:var(--art);aspect-ratio:1}
.sleeve{position:absolute;inset:0;border-radius:8px;overflow:hidden;z-index:2;box-shadow:0 40px 80px rgba(0,0,0,.6)}
.sleeve img{width:100%;height:100%;object-fit:cover;filter:contrast(1.08) saturate(1.05)}
.sleeve .st{position:absolute;inset:auto 18px 16px 18px;display:flex;justify-content:space-between;align-items:end;font:700 10px/1.3 var(--mono);letter-spacing:.18em;text-transform:uppercase;color:var(--bone);mix-blend-mode:difference}
.sleeve .st b{font-family:var(--display);font-size:30px;letter-spacing:.02em;font-weight:400}
.disc{position:absolute;top:3%;left:3%;width:94%;aspect-ratio:1;z-index:1}
.spin{position:absolute;inset:0;border-radius:50%;background:repeating-radial-gradient(circle at 50% 50%,#0d0b0a 0 2px,#1d1916 2px 3px);box-shadow:inset 0 0 0 1px rgba(255,255,255,.04),0 30px 60px rgba(0,0,0,.6)}
.spin::before{content:'';position:absolute;inset:0;border-radius:50%;background:conic-gradient(from 0deg,transparent 0 40deg,rgba(255,255,255,.08) 60deg,transparent 80deg 220deg,rgba(255,255,255,.06) 240deg,transparent 260deg)}
.spin .label{position:absolute;inset:33%;border-radius:50%;overflow:hidden;border:3px solid var(--pink)}
.spin .label img{width:100%;height:100%;object-fit:cover}
.spin .label::after{content:'';position:absolute;left:50%;top:50%;width:10px;height:10px;margin:-5px;border-radius:50%;background:var(--ink)}
.rec:nth-child(even) .spin .label{border-color:var(--cyan)}
.rmeta{padding-left:calc(var(--art)*.62)}
.rmeta .yr{font:700 11px/1 var(--mono);letter-spacing:.24em;color:var(--pink);text-transform:uppercase}
.rmeta h3{font-family:var(--display);font-weight:400;font-size:clamp(44px,6.2vw,104px);line-height:.88;text-transform:uppercase;margin:16px 0 14px}
.rmeta .lbl{font:400 12px/1.6 var(--mono);letter-spacing:.16em;text-transform:uppercase;color:var(--bone-dim)}
.rmeta .btn{margin-top:26px;padding:14px 22px}

/* drop */
.drop{height:280vh}
.drop .stick{position:sticky;top:0;height:100vh;display:flex;flex-direction:column;justify-content:center;align-items:center;gap:30px;text-align:center;overflow:hidden}
.count{font-family:var(--display);font-size:clamp(130px,34vw,560px);line-height:.8;text-transform:uppercase;will-change:transform}
.count.is-drop{color:var(--pink);text-shadow:8px 0 0 var(--cyan)}
.riser{width:min(560px,70vw);height:3px;background:var(--line);border-radius:3px;overflow:hidden}
.riser i{display:block;height:100%;width:100%;transform-origin:left;transform:scaleX(0);background:linear-gradient(90deg,var(--cyan),var(--pink))}
.drop .dl{font:700 11px/1.6 var(--mono);letter-spacing:.24em;text-transform:uppercase;color:var(--bone-dim)}
.drop .dk{position:absolute;top:110px;left:50%;transform:translateX(-50%)}

/* live */
#live{height:100vh;overflow:hidden;position:relative}
#live .pin{height:100%;display:flex;align-items:center}
.track{--w:min(64vw,112vh);display:flex;align-items:center;gap:4vw;padding:0 7vw;will-change:transform}
.lintro{flex:0 0 auto;width:min(480px,78vw)}
.lintro p{font-size:17px;line-height:1.7;color:#d8cdbf;margin-top:24px;max-width:400px}
.vcard{flex:0 0 auto;width:var(--w);aspect-ratio:16/9;position:relative;border-radius:22px;overflow:hidden;background:#000}
.vcard.tall{width:calc(var(--w)*81/256);aspect-ratio:9/16}
.vcard video{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;transform:scale(1.06)}
.vcard::after{content:'';position:absolute;inset:0;background:linear-gradient(transparent 55%,rgba(0,0,0,.75))}
.vcard .cap{position:absolute;left:22px;right:22px;bottom:20px;z-index:2;display:flex;justify-content:space-between;align-items:end;gap:12px}
.vcard .cap b{font-family:var(--display);font-weight:400;font-size:clamp(26px,3vw,48px);line-height:.95;text-transform:uppercase}
.vcard .cap span{font:700 10px/1.5 var(--mono);letter-spacing:.18em;text-transform:uppercase;color:var(--bone-dim);text-align:right;white-space:nowrap}
.vcard .idx{position:absolute;top:18px;left:22px;z-index:2;font:700 10px/1 var(--mono);letter-spacing:.2em;color:var(--bone);background:rgba(0,0,0,.4);padding:8px 10px;border-radius:99px;backdrop-filter:blur(6px)}
.vcard.tall .cap{flex-direction:column;align-items:start}
.vcard.tall .cap span{text-align:left}
.lend{flex:0 0 auto;width:min(380px,70vw);font-family:var(--display);font-size:clamp(48px,6vw,96px);line-height:.9;text-transform:uppercase}

/* shows */
.shows-head{display:flex;justify-content:space-between;align-items:end;gap:30px;flex-wrap:wrap}
.shows-head .mono{font-size:11px;letter-spacing:.2em;text-transform:uppercase;color:var(--bone-dim);max-width:300px;line-height:1.7}
.list{margin-top:9vh;border-top:1px solid var(--line)}
.row{display:grid;grid-template-columns:110px 1fr auto 30px;gap:24px;align-items:center;padding:20px 0;border-bottom:1px solid var(--line);position:relative}
.row::before{content:'';position:absolute;inset:0;background:linear-gradient(90deg,rgba(255,61,139,.14),transparent 70%);transform:scaleX(0);transform-origin:left;transition:transform .6s cubic-bezier(.2,.8,.2,1)}
.row:hover::before{transform:scaleX(1)}
.row .yr{font:700 12px/1 var(--mono);letter-spacing:.2em;color:var(--pink);position:relative}
.row .venue{position:relative;font-family:var(--display);font-size:clamp(30px,4.6vw,74px);line-height:1;text-transform:uppercase;transition:transform .6s cubic-bezier(.2,.8,.2,1),color .3s}
.row:hover .venue{transform:translateX(22px);color:var(--cyan)}
.row .city{position:relative;font:400 11px/1.4 var(--mono);letter-spacing:.18em;text-transform:uppercase;color:var(--bone-dim);text-align:right}
.row .arr{position:relative;font-family:var(--mono);transition:transform .4s}
.row:hover .arr{transform:rotate(-45deg)}
.fimg{position:fixed;left:0;top:0;width:250px;aspect-ratio:3/4;border-radius:16px;background-size:cover;background-position:center;pointer-events:none;z-index:35;transform:scale(0);box-shadow:0 30px 60px rgba(0,0,0,.5)}

/* book */
#book{min-height:100vh;display:flex;flex-direction:column;justify-content:center;align-items:center;text-align:center}
#book .kicker{justify-content:center}
.book-big{font-family:var(--display);font-weight:400;font-size:clamp(66px,15.5vw,270px);line-height:.84;text-transform:uppercase}
.book-big .o{display:inline-block;transform:scale(calc(1 + var(--bass)*.05))}
.book-sub{font:400 12px/1.8 var(--mono);letter-spacing:.2em;text-transform:uppercase;color:var(--bone-dim);margin-top:34px}
.book-mail{display:block;margin-top:18px;font:700 13px/1.6 var(--mono);letter-spacing:.12em;color:var(--bone)}
.book-mail:hover{color:var(--cyan)}
.links{display:flex;flex-wrap:wrap;gap:12px;justify-content:center;margin-top:40px}

</style>

<script>
/* All text, links and media come from content.json — edit it at /admin */
const $=s=>document.querySelector(s), $$=s=>[...document.querySelectorAll(s)];
const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const ml=s=>esc(s).replace(/\n/g,'<br>');
const pad=n=>String(n).padStart(2,'0');
const h2=(t,o)=>`${ml(t)}${o?`${t?'<br>':''}<span class="o">${ml(o)}</span>`:''}`;
function link(s){
  s=String(s||'').trim(); if(!s||s==='#') return '';
  if(/^(https?:|mailto:|tel:)/i.test(s)) return s;
  if(/^assets\//.test(s)) return s;
  if(/^[\w-]+(\.[\w-]+)+(\/|$)/.test(s)) return 'https://'+s;
  return '';
}
const RM=matchMedia('(prefers-reduced-motion: reduce)').matches;
const TOUCH=matchMedia('(hover: none)').matches;
const S={t:0,progress:0,vel:0,bass:0,bAvg:0,mx:0,my:0,tmx:0,tmy:0,cx:-200,cy:-200,dim:1,dimT:1,dropBoost:0,hp:0,playing:false};
let C=null;

/* =====================================================================
   RENDER — builds every section from content.json
   ===================================================================== */
function render(C){
  const hero=C.hero||{}, name=hero.name||'MARCOCO';
  document.title=C.site?.title||document.title;
  const md=document.querySelector('meta[name=description]'); if(md&&C.site?.description) md.content=C.site.description;
  $('#gateLine').innerHTML=esc(C.site?.gateLine||'').replace(/·/g,'<b>·</b>');
  $('#gname').innerHTML=esc(name)+'<span>'+esc(name)+'</span>';
  $('#logo').textContent=name;
  $('#plabel').textContent=C.audio?.label||'';
  $('#hudBpm').textContent=C.audio?.bpm||124;

  $('#heroL').innerHTML=ml(hero.leftText); $('#heroR').innerHTML=ml(hero.rightText);
  $('#tagL').textContent=hero.tagLeft||''; $('#tagR').textContent=hero.tagRight||'';
  $('#hint').innerHTML=ml(hero.hint);
  const mega=$('#mega'); mega.setAttribute('aria-label',name);
  mega.style.fontSize=`min(clamp(88px,22vw,380px),${(150/Math.max(name.length,1)).toFixed(2)}vw)`;
  mega.innerHTML=[...name].map(ch=>`<span class="ch"><i>${ch===' '?'&nbsp;':esc(ch)}</i></span>`).join('');

  const M=C.manifesto||{};
  $('#lines').innerHTML=(M.lines||[]).map((l,i)=>String(l).split(/\s+/).filter(Boolean).map(w=>`<span class="w${i%2?' o':''}">${esc(w)}</span>`).join(' ')).join('<br>');
  $$('[data-tape]').forEach(el=>el.textContent=((M.tape||name)+' ').repeat(8));

  const B=C.bio||{}, tl=B.timeline||[], st=B.stats||[];
  $('#bioInner').innerHTML=`
    <div class="portrait">${B.portrait?`<img src="${esc(B.portrait)}" alt="${esc(name)} portrait" loading="lazy">`:''}${B.badge?`<span class="badge">${esc(B.badge)}</span>`:''}</div>
    <div class="bio-copy glass" data-reveal>
      <div class="kicker">Bio</div>
      <h2 class="h2">${h2(B.title,B.titleOutline)}</h2>
      ${B.lead?`<p class="lead">${ml(B.lead)}</p>`:''}
      ${(B.paragraphs||[]).filter(Boolean).map(p=>`<p>${ml(p)}</p>`).join('')}
      ${tl.length?`<div class="timeline">${tl.map(t=>`<span class="chip"><b>${esc(t.year)}</b>${esc(t.label)}</span>`).join('')}</div>`:''}
      ${st.length?`<div class="stats" style="grid-template-columns:repeat(${st.length},1fr)">${st.map(s=>`<div class="stat"><div class="n"><span data-count="${Number(s.value)||0}">0</span>${s.suffix?`<sup>${esc(s.suffix)}</sup>`:''}</div><div class="l">${ml(s.label)}</div></div>`).join('')}</div>`:''}
    </div>`;

  const G=C.gallery||{}, gi=(G.images||[]).filter(g=>g&&g.src);
  if(!gi.length){ $('#gallery').remove(); $('nav a[data-to="#gallery"]')?.remove(); }
  else $('#gtrack').innerHTML=`
    <div class="gintro"><div class="kicker">Gallery</div><h2 class="h2">${h2(G.title,G.titleOutline)}</h2>${G.intro?`<p>${ml(G.intro)}</p>`:''}<div class="ghint">Scroll →</div></div>
    ${gi.map((g,i)=>`<figure class="gitem g${i%3}"><img src="${esc(g.src)}" alt="${esc(g.caption||'')}" loading="lazy"><span class="gn">${pad(i+1)} / ${pad(gi.length)}</span>${g.caption?`<figcaption>${esc(g.caption)}</figcaption>`:''}</figure>`).join('')}
    <div class="gend">${esc(name)}<br><span class="o">in focus.</span></div>`;

  const R=C.releases||{};
  $('#relInner').innerHTML=`<div class="kicker">Releases</div><h2 class="h2" data-reveal>${h2(R.title,R.titleOutline)}</h2>
    <div class="records">${(R.items||[]).map(r=>{const t1=String(r.title||'').replace(/\n/g,' '); const l=link(r.link); return `
      <article class="rec"><div class="art">
        <div class="disc"><div class="spin"><div class="label">${(r.disc||r.cover)?`<img src="${esc(r.disc||r.cover)}" alt="" loading="lazy">`:''}</div></div></div>
        <div class="sleeve">${r.cover?`<img src="${esc(r.cover)}" alt="${esc(t1)} artwork" loading="lazy">`:''}<div class="st"><b>${esc(t1)}</b><span>${esc(r.year)}</span></div></div>
      </div>
      <div class="rmeta" data-reveal><div class="yr">${esc([r.year,r.type].filter(Boolean).join(' · '))}</div><h3>${ml(r.title)}</h3><div class="lbl">${esc(r.label)}</div>
      ${l?`<a class="btn" href="${esc(l)}" target="_blank" rel="noopener">Listen →</a>`:''}</div></article>`;}).join('')}</div>`;

  const L=C.live||{}, vids=(L.videos||[]).filter(v=>v&&v.src);
  $('#track').innerHTML=`<div class="lintro"><div class="kicker">Live</div><h2 class="h2">${h2(L.title,L.titleOutline)}</h2>${L.intro?`<p>${ml(L.intro)}</p>`:''}</div>
    ${vids.map((v,i)=>`<figure class="vcard${v.vertical?' tall':''}"><span class="idx">${pad(i+1)} / ${pad(vids.length)}</span><video src="${esc(v.src)}"${v.poster?` poster="${esc(v.poster)}"`:''} muted loop playsinline preload="metadata"></video><figcaption class="cap"><b>${esc(v.title)}</b><span>${esc(v.meta)}</span></figcaption></figure>`).join('')}
    ${(L.outro||L.outroOutline)?`<div class="lend">${h2(L.outro,L.outroOutline)}</div>`:''}`;

  const SH=C.shows||{}, tunnelImgs=(C.tunnel?.images||[]).map(x=>x.src).filter(Boolean);
  $('#showsInner').innerHTML=`<div class="shows-head"><div><div class="kicker">Past shows</div><h2 class="h2" data-reveal>${h2(SH.title,SH.titleOutline)}</h2></div>${SH.intro?`<p class="mono" data-reveal>${ml(SH.intro)}</p>`:''}</div>
    <div class="list">${(SH.items||[]).map((s,i)=>`<div class="row" data-img="${esc(s.image||tunnelImgs[i%Math.max(tunnelImgs.length,1)]||'')}"><span class="yr">${esc(s.year)}</span><span class="venue">${esc(s.venue)}</span><span class="city">${esc(s.city)}</span><span class="arr">→</span></div>`).join('')}</div>`;

  const K=C.booking||{};
  const mail=K.email?`mailto:${K.email}?subject=${encodeURIComponent('Booking request — '+name)}`:'';
  const soc=(C.socials||[]).filter(s=>link(s.url));
  $('#book').innerHTML=`<div class="kicker">Booking</div>
    <h2 class="book-big" data-reveal>${h2(K.title,K.titleOutline)}</h2>
    ${K.sub?`<p class="book-sub" data-reveal>${esc(K.sub)}</p>`:''}
    ${K.email?`<a class="book-mail" href="${esc(mail)}" data-reveal>${esc(K.email)}</a>`:''}
    <div class="links" data-reveal>
      ${mail?`<a class="btn primary" href="${esc(mail)}">${esc(K.buttonLabel||'Booking request →')}</a>`:''}
      ${link(K.presskit)?`<a class="btn" href="${esc(link(K.presskit))}" target="_blank" rel="noopener">Press kit</a>`:''}
      ${link(K.rider)?`<a class="btn" href="${esc(link(K.rider))}" target="_blank" rel="noopener">Tech &amp; hospitality rider</a>`:''}
    </div>
    ${soc.length?`<div class="socials" data-reveal>${soc.map(s=>`<a href="${esc(link(s.url))}" target="_blank" rel="noopener">${esc(s.label)}</a>`).join('')}</div>`:''}`;

  const F=C.footer||{};
  $('#footer').innerHTML=`<span>${esc(F.left)}</span><span>${esc(F.right)}</span>`;
}

/* =====================================================================
   THREE — the groove tunnel
   ===================================================================== */
const canvas=$('#gl');
const renderer=new THREE.WebGLRenderer({canvas,antialias:false,powerPreference:'high-performance'});
renderer.setPixelRatio(Math.min(devicePixelRatio,TOUCH?1.5:1.75));
renderer.setSize(innerWidth,innerHeight);
renderer.setClearColor(0x0b0907,1);
const scene=new THREE.Scene();
scene.fog=new THREE.Fog(0x0b0907,18,95);
const camera=new THREE.PerspectiveCamera(68,innerWidth/innerHeight,0.1,140);
camera.position.set(0,0,6);

const VS=`
uniform float uTime; uniform float uBass; uniform float uVel;
varying vec2 vUv;
void main(){
  vUv=uv;
  vec3 p=position;
  p.z -= p.x*p.x*uVel*0.035;
  p.z += sin(p.y*1.6+uTime*3.0)*uBass*0.28;
  p.x += sin(p.y*4.0+uTime*6.0)*uBass*0.05;
  gl_Position=projectionMatrix*modelViewMatrix*vec4(p,1.0);
}`;
const FS=`
uniform sampler2D uTex; uniform float uBass; uniform float uVel; uniform float uTime; uniform float uAlpha; uniform vec3 uTint;
varying vec2 vUv;
void main(){
  vec2 uv=vUv;
  uv.x += sin(uv.y*38.0+uTime*9.0)*0.003*uBass;
  float s=0.003+abs(uVel)*0.022+uBass*0.014;
  float r=texture2D(uTex,uv+vec2(s,0.0)).r;
  float g=texture2D(uTex,uv).g;
  float b=texture2D(uTex,uv-vec2(s,0.0)).b;
  vec3 c=vec3(r,g,b);
  float l=dot(c,vec3(.299,.587,.114));
  c=mix(c,mix(vec3(.04,.02,.03),uTint,l),.18);
  c+=uTint*uBass*0.07;
  c*=0.94+0.06*sin(vUv.y*900.0);
  float e=smoothstep(0.0,0.06,vUv.x)*smoothstep(1.0,0.94,vUv.x)*smoothstep(0.0,0.06,vUv.y)*smoothstep(1.0,0.94,vUv.y);
  gl_FragColor=vec4(c,uAlpha*e);
}`;

const manager=new THREE.LoadingManager();
const loader=new THREE.TextureLoader(manager);
let textures=[];
const planes=[], rings=[];
const CAM_TRAVEL=192;
let dust=null;

function buildTunnel(){
  const tex=textures.filter(t=>t.image&&t.image.width);
  const PINK=new THREE.Color(0xff3d8b), CYAN=new THREE.Color(0x3ff0ff);
  const n=tex.length;
  for(let i=0;i<24&&n;i++){
    const t=tex[i===0?0:(i*5+Math.floor(i/3))%n]; const asp=t.image.width/t.image.height;
    let h=3.1,x,y,z,rz=0;
    if(i===0){h=asp>1.2?8.4:9.5;x=0;y=0;z=-5;}
    else{const a=i*2.39996, r=3.0+(i%3)*.55; x=Math.cos(a)*r*1.3; y=Math.sin(a)*r*.7; z=-5-i*7.6; rz=Math.sin(i*12.9)*.14;}
    const mat=new THREE.ShaderMaterial({vertexShader:VS,fragmentShader:FS,transparent:true,depthWrite:false,
      uniforms:{uTex:{value:t},uTime:{value:0},uBass:{value:0},uVel:{value:0},uAlpha:{value:1},uTint:{value:i%2?PINK:CYAN}}});
    const m=new THREE.Mesh(new THREE.PlaneGeometry(h*asp,h,24,24),mat);
    m.position.set(x,y,z); m.rotation.z=rz; m.rotation.y=-x*.05;
    scene.add(m); planes.push(m);
  }
  const pts=[]; for(let k=0;k<6;k++){const a=k/6*Math.PI*2+Math.PI/6; pts.push(new THREE.Vector3(Math.cos(a)*7,Math.sin(a)*7*.78,0));}
  const rgeo=new THREE.BufferGeometry().setFromPoints(pts);
  const cols=[0xff3d8b,0x3ff0ff,0xefe6da];
  for(let i=0;i<92;i++){
    const r=new THREE.LineLoop(rgeo,new THREE.LineBasicMaterial({color:cols[i%3],transparent:true,opacity:.4}));
    r.position.z=4-i*2.6; r.rotation.z=i*.085; r.userData.i=i;
    scene.add(r); rings.push(r);
  }
  const N=TOUCH?900:1800, pos=new Float32Array(N*3);
  for(let i=0;i<N;i++){const a=Math.random()*Math.PI*2, r=1.2+Math.random()*9; pos[i*3]=Math.cos(a)*r; pos[i*3+1]=Math.sin(a)*r*.8; pos[i*3+2]=8-Math.random()*215;}
  const pg=new THREE.BufferGeometry(); pg.setAttribute('position',new THREE.BufferAttribute(pos,3));
  dust=new THREE.Points(pg,new THREE.PointsMaterial({color:0xefe6da,size:.045,transparent:true,opacity:.6,depthWrite:false}));
  scene.add(dust);
}

/* =====================================================================
   AUDIO — filter opens as you go deeper; scroll-driven high-pass build
   ===================================================================== */
let actx=null,audioEl=null,lp=null,hp=null,gainN=null,analyser=null,freq=null;
const vol=()=>clamp(Number(C?.audio?.volume??.65),0,1);
function initAudio(){
  if(audioEl||!C?.audio?.track) return;
  audioEl=new Audio(C.audio.track); audioEl.loop=true; audioEl.preload='auto';
  try{
    actx=new (window.AudioContext||window.webkitAudioContext)();
    const src=actx.createMediaElementSource(audioEl);
    hp=actx.createBiquadFilter(); hp.type='highpass'; hp.frequency.value=20; hp.Q.value=.7;
    lp=actx.createBiquadFilter(); lp.type='lowpass'; lp.frequency.value=900; lp.Q.value=.9;
    analyser=actx.createAnalyser(); analyser.fftSize=256; analyser.smoothingTimeConstant=.7;
    gainN=actx.createGain(); gainN.gain.value=0;
    src.connect(hp); hp.connect(lp); lp.connect(analyser); analyser.connect(gainN); gainN.connect(actx.destination);
    freq=new Uint8Array(analyser.frequencyBinCount);
  }catch(e){ audioEl.volume=vol(); actx=null; }
}
function play(){
  initAudio(); if(!audioEl) return;
  if(actx){ actx.resume(); const t=actx.currentTime; gainN.gain.cancelScheduledValues(t); gainN.gain.setValueAtTime(gainN.gain.value,t); gainN.gain.linearRampToValueAtTime(vol(),t+2.5); }
  audioEl.play().then(()=>{S.playing=true; syncBtn();}).catch(()=>{S.playing=false; syncBtn();});
}
function pause(){
  if(!audioEl) return;
  if(actx){const t=actx.currentTime; gainN.gain.setTargetAtTime(0,t,.15); setTimeout(()=>audioEl.pause(),500);} else audioEl.pause();
  S.playing=false; syncBtn();
}
const ppBtn=$('#pp');
function syncBtn(){
  $('#icoPlay').style.display=S.playing?'none':'block';
  $('#icoPause').style.display=S.playing?'block':'none';
  ppBtn.setAttribute('aria-label',S.playing?'Pause music':'Play music');
}
ppBtn.addEventListener('click',()=>S.playing?pause():play());
addEventListener('keydown',e=>{ if((e.key==='m'||e.key==='M')&&!e.target.closest('input,textarea')){ S.playing?pause():play(); } });

const eqBars=$$('#eq i'), pstate=$('#pstate'); let lastPstate='';
function updateAudio(){
  const lpF=900*Math.pow(20000/900,clamp(S.progress*2.2,0,1));
  if(S.playing&&analyser){
    analyser.getByteFrequencyData(freq);
    let b=0; for(let i=1;i<6;i++) b+=freq[i]; b/=5*255;
    S.bAvg+=(b-S.bAvg)*.03;
    const lvl=clamp((b-S.bAvg)*7+.2,0,1);
    S.bass+=(lvl-S.bass)*(lvl>S.bass?.55:.1);
    const t=actx.currentTime;
    lp.frequency.setTargetAtTime(lpF,t,.08);
    hp.frequency.setTargetAtTime(20+S.hp*S.hp*1600,t,.05);
    for(let i=0;i<eqBars.length;i++){const v=freq[2+i*5]/255; eqBars[i].style.transform=`scaleY(${(.08+v*.92).toFixed(3)})`;}
  }else{
    const beat=(S.t*(Number(C?.audio?.bpm)||124)/60)%1;
    S.bass=Math.pow(1-beat,6)*.45;
    for(let i=0;i<eqBars.length;i++) eqBars[i].style.transform=`scaleY(${(.08+S.bass*(.3+.5*Math.abs(Math.sin(i*1.7+S.t*2)))).toFixed(3)})`;
  }
  const zone=S.progress<.07?'Outside the club':S.progress<.28?'In the corridor':S.progress<.5?'Near the floor':'On the floor';
  const txt=`${zone} · LPF ${(lpF/1000).toFixed(1)} kHz`;
  if(txt!==lastPstate){pstate.textContent=txt; lastPstate=txt;}
}

/* =====================================================================
   KALEIDOSCOPE
   ===================================================================== */
const kc=$('#kaleido'), kx=kc.getContext('2d');
const kImg=new Image();
let kActive=false,kLocal=0;
function sizeK(){kc.width=Math.round(innerWidth*.6); kc.height=Math.round(innerHeight*.6);}
sizeK();
function drawKaleido(){
  if(!kImg.complete||!kImg.naturalWidth) return;
  const w=kc.width,h=kc.height,n=12,ang=Math.PI*2/n,R=Math.hypot(w,h)*.6;
  kx.fillStyle='#0b0907'; kx.fillRect(0,0,w,h);
  const z=(1+S.bass*.18)*Math.max(w,h)/kImg.naturalWidth*1.25;
  const iw=kImg.naturalWidth*z, ih=kImg.naturalHeight*z;
  const ox=Math.sin(S.t*.21)*iw*.1-kLocal*iw*.25, oy=Math.cos(S.t*.17)*ih*.08-ih*.35;
  kx.save(); kx.translate(w/2,h/2); kx.rotate((RM?0:S.t*.07)+kLocal*2.4);
  for(let i=0;i<n;i++){
    kx.save(); kx.rotate(i*ang); if(i%2) kx.scale(1,-1);
    kx.beginPath(); kx.moveTo(0,0); kx.arc(0,0,R,-ang/2-.004,ang/2+.004); kx.closePath(); kx.clip();
    kx.drawImage(kImg,-iw*.15+ox,oy,iw,ih);
    kx.restore();
  }
  kx.restore();
}

/* =====================================================================
   SCROLL — Lenis + GSAP
   ===================================================================== */
gsap.registerPlugin(ScrollTrigger);
let lenis=null;
if(!RM && typeof Lenis!=='undefined'){
  lenis=new Lenis({lerp:.085,smoothWheel:true,wheelMultiplier:.9});
  lenis.on('scroll',ScrollTrigger.update);
  gsap.ticker.add(t=>lenis.raf(t*1000));
  gsap.ticker.lagSmoothing(0);
  lenis.stop();
}
function goTo(sel){ const el=$(sel); if(!el) return; if(lenis) lenis.scrollTo(sel==='#top'?0:el,{duration:2.2}); else el.scrollIntoView({behavior:RM?'auto':'smooth'}); }
document.addEventListener('click',e=>{const a=e.target.closest('[data-to]'); if(a){e.preventDefault(); goTo(a.dataset.to);}});

function hScroll(section,track){
  return gsap.to(track,{x:()=>-(track.scrollWidth-innerWidth),ease:'none',
    scrollTrigger:{trigger:section,start:'top top',end:()=>'+='+Math.max(track.scrollWidth-innerWidth,1),pin:true,scrub:.7,invalidateOnRefresh:true}});
}

function setupScroll(){
  // pinned horizontal sections first (page order) so later triggers account for their pin space
  const gal=$('#gallery');
  if(gal){
    const gT=hScroll(gal,$('#gtrack'));
    const gp=$('#gprog');
    ScrollTrigger.create({trigger:gal,start:'top top',end:()=>'+='+Math.max($('#gtrack').scrollWidth-innerWidth,1),onUpdate:s=>gp.style.transform=`scaleX(${s.progress.toFixed(4)})`});
    $$('.gitem').forEach(it=>{
      gsap.fromTo(it.querySelector('img'),{xPercent:-8,scale:1.15},{xPercent:8,scale:1,ease:'none',scrollTrigger:{trigger:it,containerAnimation:gT,start:'left right',end:'right left',scrub:true}});
      gsap.fromTo(it,{clipPath:'inset(0% 0% 0% 100% round 20px)'},{clipPath:'inset(0% 0% 0% 0% round 20px)',ease:'none',scrollTrigger:{trigger:it,containerAnimation:gT,start:'left 100%',end:'left 55%',scrub:true}});
    });
  }
  hScroll($('#live'),$('#track'));

  gsap.to('.mega .ch',{
    scrollTrigger:{trigger:'.hero',start:'top top',end:'bottom bottom',scrub:.8},
    z:i=>500+(i*137%5)*170, rotationX:i=>((i*73)%120)-60, rotationY:i=>((i*51)%90)-45,
    xPercent:(i,el,all)=>(i-(all.length-1)/2)*70, yPercent:i=>((i*37)%140)-70, opacity:0, ease:'power2.in'
  });
  gsap.to(['.hero .tags','.hero .side','.hint'],{opacity:0,y:-40,scrollTrigger:{trigger:'.hero',start:'top top',end:'30% top',scrub:true}});

  const words=gsap.utils.toArray('#lines .w');
  gsap.timeline({scrollTrigger:{trigger:'.manifesto',start:'top top',end:'bottom bottom',scrub:.6,onUpdate:s=>{kLocal=s.progress;}}})
    .fromTo('.kwrap',{clipPath:'circle(0% at 50% 50%)'},{clipPath:'circle(80% at 50% 50%)',ease:'none',duration:.35},0)
    .to(words,{opacity:1,stagger:.06,duration:.08,ease:'none'},.12)
    .fromTo('#lines',{scale:.9},{scale:1.12,ease:'none',duration:1},0);
  ScrollTrigger.create({trigger:'.manifesto',start:'top bottom',end:'bottom top',onToggle:s=>kActive=s.isActive});

  const active=new Map();
  $$('[data-dim]').forEach(el=>ScrollTrigger.create({trigger:el,start:'top 65%',end:'bottom 35%',
    onToggle:s=>{ s.isActive?active.set(el,parseFloat(el.dataset.dim)):active.delete(el); S.dimT=active.size?Math.min(...active.values()):1; }}));

  $$('nav a[data-to]').forEach(a=>{const el=$(a.dataset.to); if(!el) return;
    ScrollTrigger.create({trigger:el,start:'top 50%',end:'bottom 50%',onToggle:s=>a.classList.toggle('on',s.isActive&&!a.classList.contains('book'))});});

  gsap.utils.toArray('[data-reveal]').forEach(el=>gsap.from(el,{y:70,opacity:0,duration:1.3,ease:'expo.out',scrollTrigger:{trigger:el,start:'top 88%'}}));
  if($('.portrait img')){
    gsap.fromTo('.portrait',{clipPath:'inset(100% 0% 0% 0%)'},{clipPath:'inset(0% 0% 0% 0%)',ease:'none',scrollTrigger:{trigger:'.portrait',start:'top 90%',end:'top 35%',scrub:true}});
    gsap.fromTo('.portrait img',{yPercent:-8},{yPercent:8,ease:'none',scrollTrigger:{trigger:'.portrait',start:'top bottom',end:'bottom top',scrub:true}});
  }
  $$('[data-count]').forEach(el=>{const o={v:0}; ScrollTrigger.create({trigger:el,start:'top 90%',once:true,
    onEnter:()=>gsap.to(o,{v:+el.dataset.count,duration:1.8,ease:'power3.out',onUpdate:()=>el.textContent=Math.round(o.v)})});});

  gsap.utils.toArray('.rec').forEach(r=>gsap.fromTo(r.querySelector('.disc'),{xPercent:0},{xPercent:()=>innerWidth<900?26:52,ease:'power2.out',
    scrollTrigger:{trigger:r,start:'top 85%',end:'top 35%',scrub:1,invalidateOnRefresh:true}}));

  gsap.utils.toArray('.row').forEach((r,i)=>gsap.from(r,{opacity:0,y:40,duration:1,ease:'expo.out',delay:(i%4)*.05,scrollTrigger:{trigger:r,start:'top 92%'}}));

  const countEl=$('#count'), riser=$('#riser'), dl=$('#dropLabel');
  let dropped=false;
  ScrollTrigger.create({trigger:'.drop',start:'top top',end:'bottom bottom',
    onUpdate:s=>{
      const p=s.progress, P=.84;
      S.hp=p<P?Math.pow(p/P,1.4):0;
      riser.style.transform=`scaleX(${Math.min(p/P,1)})`;
      const label=p<.22?'Build':p<.42?'3':p<.6?'2':p<P?'1':'Drop';
      if(countEl.textContent!==label){countEl.textContent=label; countEl.classList.toggle('is-drop',label==='Drop');}
      dl.textContent=p<P?`High-pass ${Math.round(20+S.hp*S.hp*1600)} Hz — keep scrolling`:'Full range — welcome in';
      if(p>=P&&!dropped){dropped=true; fireDrop();}
      if(p<.6) dropped=false;
    },
    onLeave:()=>{S.hp=0;}, onLeaveBack:()=>{S.hp=0;}
  });

  const io=new IntersectionObserver(es=>es.forEach(e=>{const v=e.target; if(e.isIntersecting){v.play().catch(()=>{});} else v.pause();}),{threshold:.15});
  $$('.vcard video').forEach(v=>io.observe(v));

  ScrollTrigger.refresh();
}
function fireDrop(){
  S.dropBoost=1.6;
  gsap.fromTo('#flash',{opacity:1},{opacity:0,duration:.6,ease:'power3.out'});
  gsap.fromTo('#count',{scale:1.35},{scale:1,duration:.9,ease:'elastic.out(1,.4)'});
}

/* =====================================================================
   POINTER, LIGHTBOX
   ===================================================================== */
const cursor=$('#cursor');
addEventListener('pointermove',e=>{S.cx=e.clientX; S.cy=e.clientY; S.tmx=e.clientX/innerWidth*2-1; S.tmy=e.clientY/innerHeight*2-1;});
document.addEventListener('pointerover',e=>{cursor.classList.toggle('hot',!!e.target.closest('a,button,.row,.rec,.vcard,.gitem'));});
const fimg=$('.fimg'); let fx=innerWidth/2,fy=innerHeight/2,fs=0,fsT=0;
document.addEventListener('mouseover',e=>{const r=e.target.closest('.row'); if(r&&r.dataset.img){fimg.style.backgroundImage=`url("${r.dataset.img}")`; fsT=1;}});
document.addEventListener('mouseout',e=>{const r=e.target.closest('.row'); if(r&&!r.contains(e.relatedTarget)) fsT=0;});
const lb=$('#lb');
function closeLb(){lb.classList.remove('on'); if(lenis) lenis.start();}
document.addEventListener('click',e=>{
  const g=e.target.closest('.gitem');
  if(g){const im=g.querySelector('img'); lb.querySelector('img').src=im.src; lb.querySelector('p').textContent=im.alt; lb.classList.add('on'); if(lenis) lenis.stop(); return;}
  if(e.target.closest('#lb')) closeLb();
});
addEventListener('keydown',e=>{if(e.key==='Escape'&&lb.classList.contains('on')) closeLb();});

/* =====================================================================
   LOOP
   ===================================================================== */
let tapes=[],spins=[],skews=[],gitems=[];
const hudBar=$('#hudBar'), hudDepth=$('#hudDepth'), hudDot=$('#hudDot'), countEl2=$('#count');
let lastY=0,dir=1,ready=false,spinA=0;

function loop(time,deltaTime){
  const dt=Math.min(deltaTime/1000,.05)||.016;
  S.t=time;
  const max=document.documentElement.scrollHeight-innerHeight;
  const y=lenis?lenis.scroll:scrollY;
  S.progress=max>0?clamp(y/max,0,1):0;
  const rv=lenis?lenis.velocity:(y-lastY); lastY=y;
  S.vel+=(clamp(rv/45,-1.6,1.6)-S.vel)*.1;
  if(Math.abs(rv)>.5) dir=rv>0?1:-1;
  updateAudio();
  S.dim+=(S.dimT-S.dim)*.05;
  S.dropBoost*=.95;
  S.mx+=(S.tmx-S.mx)*.05; S.my+=(S.tmy-S.my)*.05;
  const B=S.bass+S.dropBoost*.6;

  if(ready){
    const camZ=6-S.progress*CAM_TRAVEL;
    const sh=S.dropBoost*.12+S.hp*S.hp*.05;
    camera.position.set(S.mx*.9+(Math.random()-.5)*sh,-S.my*.55+(Math.random()-.5)*sh,camZ);
    camera.lookAt(S.mx*.25,-S.my*.15,camZ-12);
    if(!RM) camera.rotateZ(S.progress*Math.PI*.9+S.vel*.22+Math.sin(time*.3)*.025);
    camera.fov=66+Math.abs(S.vel)*20+S.dropBoost*22-S.hp*10;
    camera.updateProjectionMatrix();
    for(const p of planes){
      const u=p.material.uniforms, d=camZ-p.position.z;
      const a=clamp((78-d)/40,0,1)*clamp((d-.8)/4,0,1)*S.dim;
      u.uAlpha.value=a; p.visible=a>.003;
      if(p.visible){u.uTime.value=time; u.uBass.value=B; u.uVel.value=S.vel;}
    }
    const rd=.45+.55*S.dim;
    for(const r of rings){
      const d=camZ-r.position.z, i=r.userData.i;
      r.material.opacity=clamp((90-d)/50,0,1)*clamp((d-.5)/6,0,1)*.5*rd;
      const pulse=Math.max(0,Math.sin(i*.45-time*7.5));
      const s=1+B*.22*pulse; r.scale.set(s,s,1);
      r.rotation.z=i*.085+(RM?0:time*.05);
    }
    if(dust) dust.rotation.z=time*.02;
    renderer.render(scene,camera);
  }

  if(kActive) drawKaleido();
  for(const tp of tapes){
    const half=tp.el.scrollWidth/2;
    tp.x-=(1+Math.abs(S.vel)*9)*dir*(tp.k?-1:1)*(dt*60);
    if(tp.x<-half) tp.x+=half; if(tp.x>0) tp.x-=half;
    tp.el.style.transform=`translate3d(${tp.x.toFixed(1)}px,0,0)`;
  }
  spinA+=(30+Math.abs(S.vel)*280+B*90)*dt;
  for(const s of spins) s.style.transform=`rotate(${spinA.toFixed(2)}deg)`;
  if(!RM){
    const sk=`skewY(${(S.vel*1.6).toFixed(3)}deg)`; for(const el of skews) el.style.transform=sk;
    const gk=`skewX(${(-S.vel*3).toFixed(3)}deg)`; for(const el of gitems) el.style.transform=gk;
  }
  if(S.hp>0){const a=S.hp*S.hp*10; countEl2.style.translate=`${((Math.random()-.5)*a).toFixed(1)}px ${((Math.random()-.5)*a).toFixed(1)}px`;} else countEl2.style.translate='0 0';
  hudBar.style.transform=`scaleY(${S.progress.toFixed(4)})`;
  hudDepth.textContent=String(Math.round(S.progress*CAM_TRAVEL)).padStart(3,'0')+' M';
  hudDot.style.transform=`scale(${(.6+B*1.2).toFixed(3)})`;
  document.documentElement.style.setProperty('--bass',B.toFixed(3));
  cursor.style.transform=`translate3d(${S.cx}px,${S.cy}px,0) scale(${(1+B*.35).toFixed(3)})`;
  const ox=fx; fx+=(S.cx-fx)*.14; fy+=(S.cy-fy)*.14; fs+=(fsT-fs)*.14;
  const rot=clamp((fx-ox)*.9,-14,14);
  fimg.style.transform=`translate3d(${(fx-125).toFixed(1)}px,${(fy-166).toFixed(1)}px,0) rotate(${rot.toFixed(2)}deg) scale(${fs.toFixed(3)})`;
}
gsap.ticker.add(loop);

addEventListener('resize',()=>{
  renderer.setSize(innerWidth,innerHeight);
  camera.aspect=innerWidth/innerHeight; camera.updateProjectionMatrix();
  sizeK();
});

/* =====================================================================
   BOOT + GATE
   ===================================================================== */
const gpct=$('#gpct'), gfill=()=>$('#gname span');
let loadP=0;
function setLoad(p){loadP=Math.max(loadP,p); gpct.textContent=String(Math.round(loadP*100)).padStart(3,'0'); const f=gfill(); if(f) f.style.clipPath=`inset(${(100-loadP*100).toFixed(1)}% 0 0 0)`;}

async function boot(){
  try{
    const r=await fetch('content.json?v='+Date.now(),{cache:'no-store'});
    if(!r.ok) throw new Error(r.status);
    C=await r.json();
  }catch(e){ $('#gstatus').textContent='Could not load content.json'; return; }
  render(C);
  tapes=$$('[data-tape]').map((el,k)=>({el,x:k?-400:0,k}));
  spins=$$('.spin'); skews=$$('.skew'); gitems=$$('.gitem');
  if(C.manifesto?.image) kImg.src=C.manifesto.image;

  let imgs=(C.tunnel?.images||[]).map(x=>x&&x.src).filter(Boolean);
  if(!imgs.length) imgs=(C.gallery?.images||[]).map(x=>x.src).filter(Boolean);
  const done=async()=>{
    try{ await document.fonts.ready; }catch(e){}
    buildTunnel(); ready=true; setLoad(1);
    setupScroll();
    $('.g-btns').classList.add('ready');
  };
  if(!imgs.length){ done(); return; }
  manager.onProgress=(u,l,t)=>setLoad(l/t*.9);
  manager.onLoad=done;
  textures=imgs.map(src=>{const t=loader.load(src); t.minFilter=THREE.LinearFilter; t.generateMipmaps=false; return t;});
}
function enter(withSound){
  if(withSound) play();
  document.body.classList.remove('locked');
  if(lenis) lenis.start();
  gsap.to('#gate',{clipPath:'circle(0% at 50% 50%)',duration:1.5,ease:'expo.inOut',onComplete:()=>{$('#gate').remove(); ScrollTrigger.refresh();}});
  gsap.from('.mega .ch i',{yPercent:120,opacity:0,stagger:.07,duration:1.6,ease:'expo.out',delay:.6});
  gsap.from(['.top','.player','.hud'],{opacity:0,y:-10,duration:1,delay:1.1,stagger:.1});
}
$('#enterSound').addEventListener('click',()=>enter(true));
$('#enterSilent').addEventListener('click',()=>enter(false));
boot();
</script>
